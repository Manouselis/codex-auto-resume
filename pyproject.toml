[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-auto-resume"
version = "0.4.0"
description = "Real included-usage reset continuation for explicitly armed Codex tasks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
codex-auto-resume = "auto_resume.cli:main"

[tool.setuptools.packages.find]
include = ["auto_resume*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
